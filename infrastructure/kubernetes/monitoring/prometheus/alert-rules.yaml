apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: food-subscription-alerts
  namespace: monitoring
  labels:
    release: prometheus
    app: food-subscription
spec:
  groups:
    - name: service-alerts
      interval: 30s
      rules:
        - alert: ServiceDown
          expr: up{job=~"catalog-service|auth-service|subscription-service"} == 0
          for: 1m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "{{ $labels.job }} has been down for more than 1 minute"
            runbook_url: "https://wiki.food-subscription.local/runbooks/service-down"

        - alert: HighLatency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=~"catalog-service|auth-service|subscription-service"}[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "High latency detected"
            description: "95th percentile latency is above 500ms for {{ $labels.job }}"

        - alert: HighErrorRate
          expr: rate(http_requests_total{status=~"5..",job=~"catalog-service|auth-service|subscription-service"}[5m]) / rate(http_requests_total{job=~"catalog-service|auth-service|subscription-service"}[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "High error rate detected"
            description: "Error rate is above 5% for {{ $labels.job }}"

        - alert: RateLimitExceeded
          expr: rate(catalog_http_requests_total{status="429"}[5m]) > 10
          for: 2m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Rate limit exceeded frequently"
            description: "More than 10 requests per second are being rate limited"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="food-subscription"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod has restarted multiple times in the last 15 minutes"

        - alert: PodHighMemoryUsage
          expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 80
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} high memory usage"
            description: "Memory usage is above 80% of limit"

        - alert: PodHighCPUUsage
          expr: (rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota) * 100 > 80
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} high CPU usage"
            description: "CPU usage is above 80% of quota"

    - name: kafka-alerts
      interval: 30s
      rules:
        - alert: KafkaConsumerLag
          expr: kafka_consumer_lag > 1000
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Kafka consumer lag is high"
            description: "Consumer lag is above 1000 messages for {{ $labels.consumer_group }}"

        - alert: KafkaBrokerDown
          expr: kafka_brokers < 3
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Kafka broker is down"
            description: "Less than 3 brokers are available"

    - name: database-alerts
      interval: 30s
      rules:
        - alert: MongoDBHighConnections
          expr: mongodb_ss_connections{state="current"} > 100
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "MongoDB high connections"
            description: "MongoDB has more than 100 active connections"


        - alert: PostgreSQLHighConnections
          expr: pg_stat_activity_count > 50
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "PostgreSQL high connections"
            description: "PostgreSQL has more than 50 active connections"