apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limit-config
  namespace: istio-system
data:
  config.yaml: |
    domain: food-subscription
    descriptors:
      - key: PATH
        value: "/api/v1/admin"
        rate_limit:
          unit: minute
          requests_per_unit: 50  
      - key: PATH
        value: "/api/v1/menu"
        rate_limit:
          unit: minute
          requests_per_unit: 100  
      - key: PATH
        value: "/api/v1/auth"
        rate_limit:
          unit: minute
          requests_per_unit: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limit-service
  namespace: istio-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rate-limit-service
  template:
    metadata:
      labels:
        app: rate-limit-service
    spec:
      containers:
        - name: rate-limit-service
          image: envoyproxy/ratelimit:latest
          env:
            - name: USE_STATSD
              value: "false"
            - name: REDIS_SOCKET_TYPE
              value: "tcp"
            - name: REDIS_URL
              value: "redis:6379"
            - name: RUNTIME_ROOT
              value: "/data"
            - name: RUNTIME_SUBDIRECTORY
              value: "ratelimit"
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
          ports:
            - containerPort: 8080
            - containerPort: 6070
      volumes:
        - name: config
          configMap:
            name: rate-limit-config
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limit-service
  namespace: istio-system
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8080
  selector:
    app: rate-limit-service