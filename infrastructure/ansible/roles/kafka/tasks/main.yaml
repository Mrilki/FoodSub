---
- name: Install Strimzi Operator
  kubernetes.core.k8s:
    state: present
    src: https://strimzi.io/install/latest?namespace=kafka
  tags: [kafka, operator]

- name: Wait for Strimzi Operator to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: strimzi-cluster-operator
    namespace: kafka
  register: strimzi_deployment
  until: strimzi_deployment.resources[0].status.readyReplicas == 1
  retries: 30
  delay: 10
  tags: [kafka, operator]

- name: Deploy Kafka Cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: kafka.strimzi.io/v1beta2
      kind: Kafka
      metadata:
        name: food-kafka
        namespace: kafka
      spec:
        kafka:
          version: 3.6.0
          replicas: 3
          listeners:
            - name: plain
              port: 9092
              type: internal
              tls: false
            - name: tls
              port: 9093
              type: internal
              tls: true
          config:
            offsets.topic.replication.factor: 3
            transaction.state.log.replication.factor: 3
            transaction.state.log.min.isr: 2
            default.replication.factor: 3
            min.insync.replicas: 2
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 10Gi
                deleteClaim: false
        zookeeper:
          replicas: 3
          storage:
            type: persistent-claim
            size: 5Gi
            deleteClaim: false
        entityOperator:
          topicOperator: {}
          userOperator: {}
  tags: [kafka, cluster]

- name: Create Kafka Topics
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: kafka.strimzi.io/v1beta2
      kind: KafkaTopic
      metadata:
        name: "{{ item.name }}"
        namespace: kafka
        labels:
          strimzi.io/cluster: food-kafka
      spec:
        partitions: "{{ item.partitions }}"
        replicas: "{{ item.replicas }}"
        config:
          retention.ms: 604800000
          segment.bytes: 1073741824
  loop:
    - { name: 'user.events', partitions: 3, replicas: 3 }
    - { name: 'order.events', partitions: 3, replicas: 3 }
    - { name: 'menu.events', partitions: 3, replicas: 3 }
  tags: [kafka, topics]