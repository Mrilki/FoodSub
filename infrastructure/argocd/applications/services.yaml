apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mrilki/FoodSub
    targetRevision: HEAD
    path: infrastructure/helm/auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: food-subscription
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

