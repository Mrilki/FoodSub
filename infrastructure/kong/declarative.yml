_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
          - /api/v1/users

  - name: subscription-service
    url: http://subscription-service:8082
    routes:
      - name: subscription-route
        paths:
          - /api/v1/subscriptions
          - /api/v1/orders

  - name: catalog-service
    url: http://catalog-service:8083
    routes:
      - name: catalog-route
        paths:
          - /api/v1/menu
          - /api/v1/admin/menu

plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: redis
      redis_host: redis
      redis_port: 6379
      fault_tolerant: true
      hide_client_headers: false

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600