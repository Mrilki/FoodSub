spring.application.name=auth

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_aps
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

jwt.secret="superSecretKeyForProjectMustBeLongEnough32Chars!"
jwt.access-expiration=900000
jwt.refresh-expiration=2592000000 

kafka.enabled=true
kafka.bootstrap-servers=localhost:9092
kafka.topics.user-events=user.events

spring.kafka.producer.bootstrap-servers=${kafka.bootstrap-servers}
spring.kafka.producer.acks=1
spring.kafka.producer.retries=1
spring.kafka.producer.retry-backoff-ms=100
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.delivery-timeout-ms=2000

spring.kafka.producer.properties.max.block.ms=2000


