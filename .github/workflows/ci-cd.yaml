name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_AUTH: ${{ github.repository }}/auth-service
  IMAGE_NAME_SUBSCRIPTION: ${{ github.repository }}/subscription-service
  IMAGE_NAME_CATALOG: ${{ github.repository }}/catalog-service

jobs:
  build-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          file: services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AUTH }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AUTH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-subscription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Subscription Service
        uses: docker/build-push-action@v5
        with:
          context: services/subscription-service
          file: services/subscription-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SUBSCRIPTION }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SUBSCRIPTION }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Catalog Service
        uses: docker/build-push-action@v5
        with:
          context: services/catalog-service
          file: services/catalog-service/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CATALOG }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CATALOG }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-catalog:
    runs-on: ubuntu-latest
    needs: build-catalog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Tests
        run: |
          cd services/catalog-service
          go test ./... -race -coverprofile=coverage.out

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/catalog-service/coverage.out
          flags: catalog-service

  update-helm:
    needs: [build-auth, build-subscription, build-catalog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Helm Chart tags
        run: |
          sed -i "s|tag: .*|tag: ${{ github.sha }}|g" infrastructure/helm/*/values.yaml

      - name: Commit and Push Helm Updates
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add infrastructure/helm/*/values.yaml
          git commit -m "ci: update image tags to ${{ github.sha }}" || echo "No changes"
          git push

  argocd-sync:
    needs: update-helm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger ArgoCD Sync
        run: |
          echo "Triggering ArgoCD sync..."
          # В продакшене: curl -X POST ${{ secrets.ARGOCD_API_URL }}/api/v1/applications/food-subscription-root/sync
          echo "Sync triggered for all applications"